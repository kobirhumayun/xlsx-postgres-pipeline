services:
  app:
    build:
      context: .
      target: runner
      args:
        ALPINE_VERSION: ${POSTGRES_ALPINE_VERSION:-3.23}
        POSTGRES_CLIENT_MAJORS: ${POSTGRES_CLIENT_MAJORS:-16 17 18}
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      BACKUP_DATABASE_URL: ${BACKUP_DATABASE_URL:-}
      RESTORE_DATABASE_URL: ${RESTORE_DATABASE_URL:-}
      QUERY_PREVIEW_LIMIT: ${QUERY_PREVIEW_LIMIT:-1000}
    volumes:
      - ./backups:/backups

  db:
    image: postgres:18
    profiles: [ "localdb" ]
    environment:
      POSTGRES_DB: xlsx_pipeline
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres18_data:/var/lib/postgresql

  pgadmin:
    image: dpage/pgadmin4
    profiles: [ "tools" ]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "5050:80"

  backup:
    build:
      context: ./backup
      args:
        ALPINE_VERSION: ${POSTGRES_ALPINE_VERSION:-3.23}
        POSTGRES_CLIENT_MAJORS: ${POSTGRES_CLIENT_MAJORS:-16 17 18}
    container_name: backup_service
    profiles: [ "tools", "backup" ]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      BACKUP_DATABASE_URL: ${BACKUP_DATABASE_URL:-}
      RESTORE_DATABASE_URL: ${RESTORE_DATABASE_URL:-}
      BACKUP_SCHEDULE: ${BACKUP_SCHEDULE:-0 0 * * *} # Daily at midnight
      RETENTION_DAYS: ${RETENTION_DAYS:-7}
    volumes:
      - ./backups:/backups

volumes:
  # Retained for rollback of installations previously using PostgreSQL 16.
  postgres_data:
  postgres18_data:
